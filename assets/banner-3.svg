<svg width="1448" height="500" viewBox="0 0 1448 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-weight: 900;
        fill: #F8FAFC;
      }
      .text {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-weight: 700;
        fill: #CBD5E1;
      }
    </style>
  </defs>

  <rect width="1448" height="500" rx="30" fill="url(#bg)"/>

  <circle cx="190" cy="100" r="3" fill="#60A5FA"/>
  <circle cx="260" cy="380" r="2" fill="#A855F7"/>
  <circle cx="1200" cy="120" r="2" fill="#22C55E"/>
  <circle cx="1320" cy="360" r="3" fill="#60A5FA"/>

  <text x="90" y="145" font-size="48" class="title">
    Prince Raj
  </text>

  <text x="90" y="210" font-size="36" class="title">
    Frontend Developer from India 🇮🇳
  </text>

  <text x="90" y="275" font-size="29" class="text">
    HTML • CSS • JS • React • MySQL • MongoDB • Python
  </text>

  <text x="90" y="330" font-size="29" class="text">
    Building projects, learning deeply, improving daily.
  </text>

  <g filter="url(#glow)">
    <rect x="900" y="105" width="370" height="270" rx="34" fill="#071827" stroke="url(#accent)" stroke-width="3"/>
    <text x="965" y="190" font-size="34" class="title">Current Focus</text>
    <text x="965" y="250" font-size="28" class="text">⚡ Build real projects</text>
    <text x="965" y="305" font-size="28" class="text">🌱 Learn Java &amp; Go</text>
    <text x="965" y="360" font-size="28" class="text">🚀 Grow as developer</text>
  </g>
</svg>
